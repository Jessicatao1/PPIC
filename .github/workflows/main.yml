name: Collaborative Workflow

on:
  push:
    branches:
      - main

jobs:
  update_html_and_readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
          
      - name: Update HTML - Jessica Tao
        if: github.actor == 'Jessicatao1'
        run: | 
          echo "Jessica Tao detected"
          sed -i '/<\/body>/i\\ <p> Updated by Jessica on '"$(date)"'</p>' index.html

      - name: Update HTML (Member 1)
        if: github.actor == 'ConnorTang2110'
        run: | 
          echo "Team member 1 Connor Tang detected"
          sed -i '/<\/body>/i <p>Updated by Member 1 on '"$(date)"'</p>' index.html
      
      - name: Update README
        run: | 
          echo "### Updated by ${{ github.actor }} on $(date '+%Y-%m-%d %H:%M:%S') [Commit: $(git rev-parse --short HEAD)]" >> README.md

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Workflow: Updated HTML and README for ${{ github.actor }}" || echo "No changes to commit"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git push origin main
          env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

