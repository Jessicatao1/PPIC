name: Collaborative Workflow

on:
  push:
    branches:
      - main

jobs:
  update_html_and_readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
          
      - name: Update HTML - Jessica Tao
        if: github.actor == 'Jessicatao1'
        run: | 
          echo "Jessica Tao detected"
          sed -i '/<\/body>/i\\ <p> Updated by Jessica on '"$(date)"'</p>' index.html

      - name: Update HTML (Member 1)
        if: github.actor == 'ConnorTang2110'
        run: | 
          echo "Team member 1 Connor Tang detected"
          sed -i '/<\/body>/i <p>Updated by Member 1 on '"$(date)"'</p>' index.html

